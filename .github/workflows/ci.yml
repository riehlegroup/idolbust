name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Write public env file from secret
        env:
          PUBLIC_ENV_FILE: ${{ secrets.PUBLIC_ENV_FILE }}
        run: |
          if [ -n "$PUBLIC_ENV_FILE" ]; then
            printf '%s\n' "$PUBLIC_ENV_FILE" > .env
          fi

      - name: Setup toolchain
        uses: jdx/mise-action@v4.3.0
        with:
          minimum_release_age: 3d

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bun x playwright install --with-deps chromium

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Storybook tests
        # Using npx instead of bun x because we had problems with Playwright and bun x.
        run: npx vitest --project=storybook --run

      - name: Build
        run: bun run build
